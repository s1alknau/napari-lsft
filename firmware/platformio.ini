; LSFT firmware - PlatformIO project
;
; Board: ESP32 NodeMCU (ESP32-WROOM-32, 38 pin) on an OSOYOO breakout.
; The "classic" ESP32 is required, not an S2/S3/C3: the galvo output uses the
; two real DAC channels (GPIO25/26), which only the classic part has.
;
;   pio run -t upload        build + flash
;   pio device monitor       serial console (115200)

[env:lsft]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -Wall
    ; ArduinoJson: we only ever parse compact machine-generated JSON
    -DARDUINOJSON_ENABLE_COMMENTS=0
