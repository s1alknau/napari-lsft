; Bench test: four laser wavelengths + continuous capillary rotation.
; Standalone -- flashing this REPLACES the LSFT firmware on the board.
; Put the real one back with:  cd ../  &&  pio run -t upload

[env:lasertest]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall
