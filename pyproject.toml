[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-lsft"
version = "0.1.0"
description = "Light Sheet Fluorescence Tomography - 3D reconstruction from rotational light-sheet data via polar-to-Cartesian interpolation"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "s1alknau"},
]
requires-python = ">=3.9"
dependencies = [
    "napari",
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "h5py",
    "zarr",
    "dask[array]",
    "qtpy",
    "magicgui",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
# Direct ESP32 (UC2) control + pulling frames from ImSwitch over HTTP
control = ["UC2-REST", "requests"]
# Live Socket.IO frame stream from ImSwitch
stream = ["python-socketio[client]", "msgpack"]
# Grab frames straight from a Daheng camera (also needs the Galaxy SDK)
daheng = ["gxipy"]

[project.urls]
"Bug Tracker" = "https://github.com/s1alknau/napari-lsft/issues"
"Source Code" = "https://github.com/s1alknau/napari-lsft"

[project.entry-points."napari.manifest"]
napari-lsft = "napari_lsft:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_lsft = ["napari.yaml"]